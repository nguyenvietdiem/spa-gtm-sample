<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample SPA for GTM test</title>
<meta name="robots" content="noindex, nofollow">

<!-- Google Tag Manager, container GTM-WRZKTJCZ (ID cung xuat hien trong noscript ben duoi) -->

new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-WRZKTJCZ');</script>

<style>
:root {
  --ink: #1d2a2a;
  --muted: #5b6b6b;
  --paper: #fbfcfb;
  --tint: #e6eeec;
  --line: #cfdad7;
  --accent: #2f4f9e;
  --accent-ink: #ffffff;
  --leaf: #3f7d5c;
  --debug-bg: #14201f;
  --debug-ink: #d6efe6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #e5eeec;
    --muted: #9fb2ae;
    --paper: #121a19;
    --tint: #1b2625;
    --line: #2c3b39;
    --accent: #8fa8ee;
    --accent-ink: #0f1620;
    --leaf: #7fc29c;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
}
h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; line-height: 1.2; margin: 0 0 .6em; }
h1 { font-size: clamp(2rem, 5vw, 3.2rem); }
h2 { font-size: 1.6rem; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
header.site {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 24px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--paper); z-index: 5;
}
.brand { font-family: Georgia, serif; font-size: 1.3rem; font-weight: 700; text-decoration: none; color: var(--ink); }
nav a { margin-left: 18px; text-decoration: none; color: var(--ink); padding: 4px 0; border-bottom: 2px solid transparent; }
nav a[aria-current="page"] { border-bottom-color: var(--accent); }
main { max-width: 860px; margin: 0 auto; padding: 40px 24px 160px; }
.btn {
  display: inline-block; border: 0; cursor: pointer; text-decoration: none;
  background: var(--accent); color: var(--accent-ink);
  padding: 10px 20px; border-radius: 6px; font: inherit; font-weight: 600;
}
.btn.ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
.lead { font-size: 1.15rem; color: var(--muted); max-width: 56ch; }
.band { background: var(--tint); border-radius: 10px; padding: 28px; margin: 40px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; margin: 24px 0; }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.item h3 { font-size: 1.15rem; }
.price { color: var(--leaf); font-weight: 700; }
.swatch { height: 90px; border-radius: 6px; margin-bottom: 12px; }
label { display: block; font-weight: 600; margin: 16px 0 4px; }
input, textarea, select {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
  background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
}
.notice { border-left: 4px solid var(--leaf); padding: 10px 14px; background: var(--tint); margin-top: 20px; }
.spacer p { max-width: 62ch; }
.crumbs { font-size: .9rem; color: var(--muted); margin-bottom: 18px; }

/* Panel debug dataLayer */
#dl-debug {
  position: fixed; left: 12px; right: 12px; bottom: 12px; max-width: 520px;
  background: var(--debug-bg); color: var(--debug-ink);
  border-radius: 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
  z-index: 20; box-shadow: 0 4px 18px rgba(0,0,0,.35);
}
#dl-debug summary { cursor: pointer; padding: 8px 12px; font-weight: 700; }
#dl-debug ol { margin: 0; padding: 0 12px 10px 30px; max-height: 190px; overflow: auto; }
#dl-debug li { margin-bottom: 6px; word-break: break-all; }
@media (prefers-reduced-motion: no-preference) {
  main.enter { animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: .4; } to { opacity: 1; } }
}
</style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WRZKTJCZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<header class="site">
  <a class="brand" href="/" data-link>Kettle &amp; Leaf</a>
  <nav aria-label="Main">
    <a href="/" data-link>Home</a>
    <a href="/products" data-link>Products</a>
    <a href="/contact" data-link>Contact</a>
  </nav>
</header>

<main id="app" tabindex="-1"></main>

<details id="dl-debug" open>
  <summary>dataLayer events (test only)</summary>
  <ol id="dl-log"></ol>
</details>

<script>
(function () {
  'use strict';

  // ---- Cau hinh ----
  var EVENT_NAME = 'screen_change';
  // Them ?debug=0 vao URL de an panel debug (de heatmap khong ghi panel nay)
  var SHOW_DEBUG = new URLSearchParams(location.search).get('debug') !== '0';

  // Che do router: 'path' (pushState, can server rewrite) hoac 'hash' (#/products).
  // Tu dong dung hash khi mo bang file:// hoac host tren *.github.io (khong co rewrite
  // va thuong nam trong thu muc con). Ep bang ?router=hash hoac ?router=path.
  var routerParam = new URLSearchParams(location.search).get('router');
  var HASH_MODE = routerParam === 'hash' ||
                  (routerParam !== 'path' &&
                   (location.protocol === 'file:' || /\.github\.io$/.test(location.hostname)));

  function currentPath() {
    if (HASH_MODE) {
      var h = location.hash.replace(/^#/, '');
      return h ? h.split('?')[0] : '/';
    }
    return location.pathname;
  }

  window.dataLayer = window.dataLayer || [];

  // ---- Du lieu mau ----
  var PRODUCTS = [
    { id: '1', name: 'Sencha Morning',  price: 1280, color: '#8fb98b', desc: 'Fresh, grassy green tea for the first cup of the day.' },
    { id: '2', name: 'Hojicha Evening', price: 1480, color: '#b98f6a', desc: 'Roasted and low in caffeine, a calm cup after dinner.' },
    { id: '3', name: 'Genmaicha Toasty', price: 1180, color: '#c7bd7a', desc: 'Green tea blended with toasted rice.' },
    { id: '4', name: 'Matcha Ceremonial', price: 3200, color: '#5f9a6e', desc: 'Stone-ground powder for usucha and koicha.' }
  ];

  function findProduct(id) {
    for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === id) return PRODUCTS[i];
    return null;
  }
  function yen(n) { return '\u00a5' + n.toLocaleString('ja-JP'); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function filler(n) {
    var out = '';
    for (var i = 0; i < n; i++) {
      out += '<p>Our tea is sourced from small farms and packed by hand. Each batch is tasted before it ships, ' +
             'so the leaf you receive matches the cup we describe. Brewing times and water temperatures are listed ' +
             'on every tin, and we answer questions about them by email.</p>';
    }
    return out;
  }

  // ---- Man hinh (screen) ----
  var screens = {
    home: function () {
      return '' +
        '<h1>Tea you can brew in three minutes</h1>' +
        '<p class="lead">Kettle &amp; Leaf is a made-up shop. This page exists only to test a single page app with Google Tag Manager.</p>' +
        '<p><a class="btn" href="/products" data-link>Browse products</a> ' +
        '<a class="btn ghost" href="/contact" data-link>Contact us</a></p>' +
        '<div class="band"><h2>How this test works</h2>' +
        '<p>Every time the screen changes, the app pushes a <code>' + EVENT_NAME + '</code> event to the dataLayer. ' +
        'The panel at the bottom shows each push as it happens.</p></div>' +
        '<div class="spacer"><h2>Why we exist</h2>' + filler(6) + '</div>' +
        '<div class="band"><h2>Ready to try one?</h2>' +
        '<p><a class="btn" href="/products/1" data-link>See Sencha Morning</a></p></div>' +
        '<div class="spacer"><h2>Shipping and returns</h2>' + filler(4) + '</div>';
    },
    products: function () {
      var cards = PRODUCTS.map(function (p) {
        return '<article class="item">' +
          '<div class="swatch" style="background:' + p.color + '"></div>' +
          '<h3>' + esc(p.name) + '</h3>' +
          '<p>' + esc(p.desc) + '</p>' +
          '<p class="price">' + yen(p.price) + '</p>' +
          '<a class="btn" href="/products/' + p.id + '" data-link>View details</a>' +
          '</article>';
      }).join('');
      return '<h1>Products</h1><p class="lead">Four teas, all in 100 g tins.</p>' +
             '<div class="grid">' + cards + '</div>' +
             '<div class="spacer">' + filler(5) + '</div>';
    },
    product: function (params) {
      var p = findProduct(params.id);
      if (!p) return screens.notFound();
      return '<p class="crumbs"><a href="/products" data-link>Products</a> / ' + esc(p.name) + '</p>' +
        '<h1>' + esc(p.name) + '</h1>' +
        '<div class="swatch" style="height:160px;background:' + p.color + '"></div>' +
        '<p class="lead">' + esc(p.desc) + '</p>' +
        '<p class="price">' + yen(p.price) + '</p>' +
        '<p><button class="btn" id="add-cart" type="button">Add to cart</button></p>' +
        '<div id="cart-msg" aria-live="polite"></div>' +
        '<div class="spacer"><h2>Brewing notes</h2>' + filler(4) + '</div>';
    },
    contact: function () {
      return '<h1>Contact</h1><p class="lead">This form does not send anything. It exists so there is something to click and type into.</p>' +
        '<form id="contact-form" novalidate>' +
        '<label for="c-name">Name</label><input id="c-name" name="name" autocomplete="name">' +
        '<label for="c-topic">Topic</label>' +
        '<select id="c-topic" name="topic"><option>Order question</option><option>Wholesale</option><option>Other</option></select>' +
        '<label for="c-msg">Message</label><textarea id="c-msg" name="message" rows="5"></textarea>' +
        '<p><button class="btn" type="submit">Send message</button></p>' +
        '</form><div id="form-msg" aria-live="polite"></div>';
    },
    notFound: function () {
      return '<h1>Page not found</h1><p class="lead">There is no screen at this address.</p>' +
             '<p><a class="btn" href="/" data-link>Go to Home</a></p>';
    }
  };

  // ---- Bang route ----
  // screen_name se duoc dung lam bien trong GTM
  var routes = [
    { pattern: /^\/$/,                   name: 'home',           title: 'Home',            render: screens.home },
    { pattern: /^\/products\/?$/,        name: 'product_list',   title: 'Products',        render: screens.products },
    { pattern: /^\/products\/([^/]+)\/?$/, name: 'product_detail', title: 'Product detail', render: function (m) { return screens.product({ id: m[1] }); }, dynamic: true },
    { pattern: /^\/contact\/?$/,         name: 'contact',        title: 'Contact',         render: screens.contact }
  ];

  function matchRoute(path) {
    for (var i = 0; i < routes.length; i++) {
      var m = path.match(routes[i].pattern);
      if (m) return { route: routes[i], match: m };
    }
    return { route: { name: 'not_found', title: 'Not found', render: screens.notFound }, match: [] };
  }

  // ---- Debug panel ----
  function logDebug(obj) {
    if (!SHOW_DEBUG) return;
    var li = document.createElement('li');
    li.textContent = JSON.stringify(obj);
    var ol = document.getElementById('dl-log');
    ol.appendChild(li);
    ol.scrollTop = ol.scrollHeight;
  }

  // ---- Push custom event ----
  var previousPath = null;
  function pushScreenChange(info, navType) {
    var payload = {
      event: EVENT_NAME,
      screen_name: info.route.name,
      page_path: currentPath(),
      page_title: document.title,
      previous_path: previousPath,
      navigation_type: navType // initial | push | popstate
    };
    window.dataLayer.push(payload);
    logDebug(payload);
    previousPath = currentPath();
  }

  // ---- Render ----
  var app = document.getElementById('app');
  function render(navType) {
    var info = matchRoute(currentPath());
    app.innerHTML = info.route.render(info.match);
    document.title = info.route.title + ' | Kettle & Leaf (SPA test)';
    // Luu duong dan goc vao data-path, o che do hash thi doi href thanh #/duong-dan
    var all = document.querySelectorAll('a[data-link]');
    for (var j = 0; j < all.length; j++) {
      var p = all[j].getAttribute('data-path') || all[j].getAttribute('href');
      all[j].setAttribute('data-path', p);
      if (HASH_MODE) all[j].setAttribute('href', '#' + p);
    }
    // Danh dau link dang active
    var links = document.querySelectorAll('nav a[data-link]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('data-path');
      var cur = currentPath();
      var active = href === '/' ? cur === '/' : cur.indexOf(href) === 0;
      if (active) links[i].setAttribute('aria-current', 'page'); else links[i].removeAttribute('aria-current');
    }
    // Hieu ung va cuon len dau trang, nhu 1 lan chuyen trang that
    app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter');
    window.scrollTo(0, 0);
    app.focus({ preventScroll: true });
    pushScreenChange(info, navType);
  }

  var pendingPush = false;
  function navigate(path) {
    if (path === currentPath()) return;
    if (HASH_MODE) {
      // Doi hash se kich hoat hashchange, render nam trong handler do
      pendingPush = true;
      location.hash = path;
      return;
    }
    history.pushState({}, '', path + location.search);
    render('push');
  }

  // ---- Su kien ----
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[data-link]') : null;
    if (!a) return;
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    navigate(a.getAttribute('data-path') || a.getAttribute('href'));
  });

  window.addEventListener('popstate', function () { if (!HASH_MODE) render('popstate'); });
  window.addEventListener('hashchange', function () {
    if (!HASH_MODE) return;
    var t = pendingPush ? 'push' : 'popstate';
    pendingPush = false;
    render(t);
  });

  document.addEventListener('click', function (e) {
    if (e.target && e.target.id === 'add-cart') {
      document.getElementById('cart-msg').innerHTML = '<p class="notice">Added to cart (demo only).</p>';
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'contact-form') {
      e.preventDefault();
      document.getElementById('form-msg').innerHTML = '<p class="notice">Message received (demo only, nothing was sent).</p>';
    }
  });

  // ---- Khoi dong ----
  if (!SHOW_DEBUG) document.getElementById('dl-debug').style.display = 'none';
  document.querySelector('#dl-debug summary').textContent += ' | router: ' + (HASH_MODE ? 'hash' : 'path');
  render('initial');
})();
</script>
</body>
</html>
